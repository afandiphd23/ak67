# Render Blueprint — ONE static site for the whole suite:
#   /                  → landing page (app selector)
#   /customs-act-app/  → Customs Act 1967 reader
#   /customs-reg-app/  → Customs Regulations 2019 reader
#   /free-zones-app/   → Free Zones Act 1990 reader
#   /free-zones-reg-app/ → Free Zones Regulations 1991 reader
# scripts/build-site.mjs assembles all five into site/.
services:
  - type: web
    name: ak67
    runtime: static
    buildCommand: npm run build
    staticPublishPath: site
    headers:
      # Always revalidate the HTML shells so deploys are picked up instantly.
      - path: /*
        name: Cache-Control
        value: no-cache
      # Hashed assets are immutable — cache for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /customs-act-app/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /customs-reg-app/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /free-zones-app/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /free-zones-reg-app/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # Fallback for unknown paths: serve the landing page.
    # (Real files always win; both readers are hash-routed so their deep
    # links never reach the server.)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
