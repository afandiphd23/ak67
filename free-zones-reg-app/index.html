<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peraturan-Peraturan Zon Bebas 1991 (P.U. (B) 455/1991)</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // Theme key is shared with the whole reader suite.
      try {
        var t = localStorage.getItem('customs-act-theme') || localStorage.getItem('customs-reg-theme')
        if (t !== 'dark' && t !== 'light' && t !== 'sepia' && t !== 'navy' && t !== 'emerald') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t === 'light' || t === 'sepia' ? 'light' : 'dark'
      } catch (e) {
        /* ignore */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
